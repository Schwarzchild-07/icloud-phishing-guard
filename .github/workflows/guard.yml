name: iCloud 24/7 Phishing Guard

on:
  schedule:
    # 20分おきに全アカウントを自動巡回（完全無料枠）
    - cron: '*/20 * * * *'
  workflow_dispatch: # 手動で即座に実行するボタン

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Cloud Phishing Guard
        env:
          ICLOUD_EMAIL: ${{ secrets.ICLOUD_EMAIL }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
          ICLOUD_EMAIL_2: ${{ secrets.ICLOUD_EMAIL_2 }}
          ICLOUD_APP_PASSWORD_2: ${{ secrets.ICLOUD_APP_PASSWORD_2 }}
        run: |
          python cloud_guard.py
